name: Validar y desplegar en GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar banco de preguntas
        run: npm test
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest .nojekyll assets content vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  desplegar:
    # Sólo se publica desde la rama por defecto del repositorio.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
