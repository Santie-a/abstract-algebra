<html lang="es">

    <script>
      // Aplica el tema guardado antes de pintar para evitar parpadeos.
      try {
        var t = JSON.parse(localStorage.getItem('aa:theme'));
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
